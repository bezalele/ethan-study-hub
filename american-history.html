<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Ethan Study Hub — an interactive walk through the American founding, with AP U.S. Government underneath.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>Ethan Study Hub · AP U.S. Government</title>

  <!-- Order matters: tokens define the variables everything else consumes. -->
  <link rel="stylesheet" href="styles/tokens.css?v=19">
  <link rel="stylesheet" href="styles/base.css?v=19">
  <link rel="stylesheet" href="layout/layout.css?v=19">

  <!-- Shared components. Each owns a .c-NAME class namespace. -->
  <link rel="stylesheet" href="components/timeline.css?v=19">

  <!-- Page stylesheets. Each is scoped to its own .page--NAME root. -->
  <link rel="stylesheet" href="pages/home.css?v=19">
  <link rel="stylesheet" href="pages/course-map.css?v=19">
  <link rel="stylesheet" href="pages/study.css?v=19">
  <link rel="stylesheet" href="pages/chapter.css?v=19">
  <link rel="stylesheet" href="pages/practice.css?v=19">
  <link rel="stylesheet" href="pages/journal.css?v=19">
  <link rel="stylesheet" href="shared/learning-log.css?v=19">
  <link rel="stylesheet" href="shared/subject-header.css?v=19">
</head>
<body>
  <a class="visually-hidden" href="#app-main">Skip to content</a>

  <header id="app-header"></header>
  <main id="app-main"></main>
  <footer id="app-footer"></footer>

  <!-- Classic script: runs before deferred modules, so the global is ready. -->
  <script src="content/contentData.js?v=19"></script>

  <!-- Shared across all three subjects. Classic script, so it is on window
       before the deferred modules run. -->
  <script src="shared/family-key.js?v=19"></script><script src="shared/learning-log.js?v=19"></script>
  <script src="shared/journal-merge.js?v=19"></script><script src="shared/journal-sync.js?v=19"></script><script src="shared/apgov-progress.js?v=19"></script><script src="shared/progress-merge.js?v=19"></script><script src="shared/progress-sync.js?v=19"></script><script src="shared/school-calendar.js?v=19"></script>
  <script src="shared/subject-header.js?v=19"></script>

  <!-- Every module URL carries the same ?v= as the stylesheets. They must match
       across the whole graph: a differing query string would load a second,
       separate instance of that module. tests/smoke.cjs enforces it. -->
  <script type="module">
    import { renderLayout } from './layout/layout.js?v=19';
    import { startRouter } from './layout/router.js?v=19';

    renderLayout();   // once, and only once
    startRouter();
  </script>
</body>
</html>
