name: Add vivid founding chapter art

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vivid-chapter-art.yml'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download colorful public institutional artwork into the repo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, os, re, time, urllib.request

          items = [
            ("https://www.aoc.gov/explore-capitol-campus/art/embarkation-pilgrims",
             "assets/chapters/colonies/embarkation-pilgrims.webp"),
            ("https://www.aoc.gov/explore-capitol-campus/art/baptism-pocahontas",
             "assets/chapters/colonies/baptism-pocahontas.webp"),
            ("https://www.aoc.gov/explore-capitol-campus/art/declaration-independence",
             "assets/chapters/declaration/declaration-aoc.webp"),
            ("https://www.aoc.gov/explore-capitol-campus/art/surrender-general-burgoyne",
             "assets/chapters/declaration/surrender-burgoyne.webp"),
            ("https://www.aoc.gov/explore-capitol-campus/art/surrender-lord-cornwallis",
             "assets/chapters/articles/surrender-cornwallis.webp"),
            ("https://www.aoc.gov/explore-capitol-campus/art/general-george-washington-resigning-his-commission",
             "assets/chapters/articles/washington-resigns.webp"),
            ("https://www.aoc.gov/explore-capitol-campus/art/signing-constitution",
             "assets/chapters/convention/signing-aoc.webp"),
            ("https://www.aoc.gov/explore-capitol-campus/art/first-federal-congress-1789",
             "assets/chapters/constitution-rights/first-federal-congress.webp"),
            ("https://www.aoc.gov/explore-capitol-campus/art/washingtons-inauguration-1789",
             "assets/chapters/constitution-rights/washington-inauguration.webp"),
          ]

          headers = {"User-Agent": "Mozilla/5.0 EthanStudyHub/1.0"}

          def fetch(url):
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=60) as r:
              return r.read()

          def og_image(page):
            text = fetch(page).decode("utf-8", "ignore")
            patterns = [
              r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']',
              r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
            ]
            for p in patterns:
              m = re.search(p, text, re.I)
              if m:
                return html.unescape(m.group(1))
            # AOC sometimes omits social meta for automated requests. The
            # actual artwork is still present in the responsive image markup.
            m = re.search(r"(https://www\\.aoc\\.gov)?(/sites/default/files/[^\\\"'<> ]+?\\.webp(?:\\?[^\\\"'<> ]*)?)", text, re.I)
            if m:
              return html.unescape((m.group(1) or 'https://www.aoc.gov') + m.group(2))
            raise RuntimeError(f"No artwork image found on {page}")

          for page, out in items:
            os.makedirs(os.path.dirname(out), exist_ok=True)
            img = og_image(page)
            print(f"{page}\n  -> {img}\n  -> {out}")
            time.sleep(1.2)
            data = fetch(img)
            if len(data) < 50000:
              raise RuntimeError(f"Downloaded image too small ({len(data)} bytes): {img}")
            with open(out, "wb") as fh:
              fh.write(data)
            time.sleep(1.2)
          PY

          file assets/chapters/colonies/*.webp
          file assets/chapters/declaration/*.webp
          file assets/chapters/articles/*.webp
          file assets/chapters/convention/*.webp
          file assets/chapters/constitution-rights/*.webp

      - name: Commit vivid local art
        shell: bash
        run: |
          git config user.name "Ethan Study Hub"
          git config user.email "actions@users.noreply.github.com"
          git add assets/chapters
          git commit -m "Add colorful Capitol artwork for founding chapter pages"
          git push
