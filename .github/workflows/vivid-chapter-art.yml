name: Add vivid founding chapter art

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vivid-chapter-art.yml'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download colorful public artwork into the repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/chapters/{colonies,declaration,articles,convention,constitution-rights}

          get() {
            local out="$1"; shift
            for url in "$@"; do
              echo "Trying $url"
              if curl -L --fail --retry 2 --retry-delay 1 --user-agent "Mozilla/5.0 EthanStudyHub/1.0" "$url" -o "$out.tmp"; then
                if [ "$(wc -c < "$out.tmp")" -gt 50000 ]; then
                  mv "$out.tmp" "$out"
                  file "$out"
                  return 0
                fi
              fi
            done
            rm -f "$out.tmp"
            echo "Could not download $out"
            return 1
          }

          base="https://www.aoc.gov/sites/default/files/styles/social_standard/public/2026-01"
          popup="https://www.aoc.gov/sites/default/files/styles/popup_image/public/2026-01"

          # Vivid historical paintings from the Architect of the Capitol.
          get assets/chapters/colonies/embarkation-pilgrims.webp             "$base/Embarkation_of_the_Pilgrims-2000w.jpg.webp"
          get assets/chapters/colonies/baptism-pocahontas.webp             "$base/Baptism_of_Pocahontas-2000w.jpg.webp"

          get assets/chapters/declaration/declaration-aoc.webp             "$base/070222-2000w-us-capitol-rotunda-painting-trumbull-declaration-independence.jpg.webp"
          get assets/chapters/declaration/surrender-burgoyne.webp             "$base/Surrender_of_General_Burgoyne-2000w.jpg.webp"             "$popup/Surrender_of_General_Burgoyne-2000w.jpg.webp"

          get assets/chapters/articles/surrender-cornwallis.webp             "$base/Surrender_of_Lord_Cornwallis-2000w.jpg.webp"             "$popup/Surrender_of_Lord_Cornwallis-2000w.jpg.webp"
          get assets/chapters/articles/washington-resigns.webp             "$base/General_George_Washington_Resigning_His_Commission-2000w.jpg.webp"             "$popup/General_George_Washington_Resigning_His_Commission-2000w.jpg.webp"

          get assets/chapters/convention/signing-aoc.webp             "$base/Signing_of_the_Constitution-2000w.jpg.webp"             "$popup/Signing_of_the_Constitution-2000w.jpg.webp" || true

          # These two are useful for the final chapter. They are optional
          # because historical AOC filenames sometimes change.
          get assets/chapters/constitution-rights/first-federal-congress.webp             "$base/The_First_Federal_Congress_1789-2000w.jpg.webp"             "$base/First_Federal_Congress_1789-2000w.jpg.webp" || true
          get assets/chapters/constitution-rights/washington-inauguration.webp             "$base/Washingtons_Inauguration_1789-2000w.jpg.webp"             "$base/Washington_Inauguration_1789-2000w.jpg.webp" || true

      - name: Commit vivid local art
        shell: bash
        run: |
          git config user.name "Ethan Study Hub"
          git config user.email "actions@users.noreply.github.com"
          git add assets/chapters
          git diff --cached --quiet && exit 0
          git commit -m "Add colorful Capitol artwork for founding chapter pages"
          git pull --rebase
          git push
