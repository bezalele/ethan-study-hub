name: Add vivid founding chapter art

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vivid-chapter-art.yml'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download institutional artwork into the repo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, os, re, urllib.request

          items = [
            ("https://www.aoc.gov/explore-capitol-campus/art/embarkation-pilgrims",
             "assets/chapters/colonies/embarkation-pilgrims.jpg"),
            ("https://www.aoc.gov/explore-capitol-campus/art/baptism-pocahontas",
             "assets/chapters/colonies/baptism-pocahontas.jpg"),
            ("https://www.aoc.gov/explore-capitol-campus/art/declaration-independence",
             "assets/chapters/declaration/declaration-aoc.jpg"),
            ("https://www.metmuseum.org/art/collection/search/11417",
             "assets/chapters/declaration/washington-crossing-delaware.jpg"),
            ("https://www.aoc.gov/explore-capitol-campus/art/surrender-general-burgoyne",
             "assets/chapters/declaration/surrender-burgoyne.jpg"),
            ("https://www.aoc.gov/explore-capitol-campus/art/surrender-lord-cornwallis",
             "assets/chapters/articles/surrender-cornwallis.jpg"),
            ("https://www.aoc.gov/explore-capitol-campus/art/general-george-washington-resigning-his-commission",
             "assets/chapters/articles/washington-resigns.jpg"),
            ("https://www.aoc.gov/explore-capitol-campus/art/signing-constitution",
             "assets/chapters/convention/signing-aoc.jpg"),
            ("https://npgallery.nps.gov/AssetDetail/4e4d7280-1dd8-b71b-0ba3-d7bec43b2b9c",
             "assets/chapters/convention/assembly-room.jpg"),
            ("https://visit.archives.gov/whats-on/explore-exhibits/charters-freedom",
             "assets/chapters/constitution-rights/charters-of-freedom.jpg"),
          ]

          headers = {"User-Agent": "Mozilla/5.0 EthanStudyHub/1.0"}

          def fetch(url):
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=60) as r:
              return r.read(), r.headers.get_content_type()

          def og_image(page):
            raw, _ = fetch(page)
            text = raw.decode("utf-8", "ignore")
            patterns = [
              r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']',
              r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
              r'<meta[^>]+name=["\']twitter:image(?::src)?["\'][^>]+content=["\']([^"\']+)["\']',
              r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']twitter:image(?::src)?["\']',
            ]
            for p in patterns:
              m = re.search(p, text, re.I)
              if m:
                return html.unescape(m.group(1))
            # NPS Gallery fallback: choose a public image link if metadata omits OG.
            m = re.search(r'https?://[^"\']+\.(?:jpg|jpeg)(?:\?[^"\']*)?', text, re.I)
            if m:
              return html.unescape(m.group(0))
            raise RuntimeError(f"No image metadata found on {page}")

          for page, out in items:
            os.makedirs(os.path.dirname(out), exist_ok=True)
            img = og_image(page)
            print(f"{page}\n  -> {img}\n  -> {out}")
            data, ctype = fetch(img)
            if len(data) < 20000:
              raise RuntimeError(f"Downloaded image too small ({len(data)} bytes): {img}")
            # Keep filename extension stable; browsers identify JPEG/PNG from bytes.
            with open(out, "wb") as f:
              f.write(data)

          PY

          # Make sure every downloaded file is a real raster image.
          file assets/chapters/colonies/*.jpg
          file assets/chapters/declaration/*.jpg
          file assets/chapters/articles/*.jpg
          file assets/chapters/convention/*.jpg
          file assets/chapters/constitution-rights/*.jpg

      - name: Commit vivid local art
        shell: bash
        run: |
          git config user.name "Ethan Study Hub"
          git config user.email "actions@users.noreply.github.com"
          git add assets/chapters
          git commit -m "Add vivid local artwork for founding chapter pages"
          git push
